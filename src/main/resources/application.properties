spring.application.name=hostel-complaint-tracker
server.port=${PORT:8080}

# The app sits behind a Vercel proxy, so redirects must be relative ("/dashboard"),
# never absolute ("https://xyz.onrender.com/dashboard").
server.tomcat.use-relative-redirects=true
server.forward-headers-strategy=native
server.servlet.session.timeout=30m

# Spring MVC views are JSPs inside WEB-INF (cannot be opened directly from the browser)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Tables are created by schema.sql (plain SQL that works on both H2 and PostgreSQL)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Keep the JVM small enough for a 512 MB free-tier container
spring.main.lazy-initialization=false
server.tomcat.threads.max=40

# ServletContext init parameters (like <context-param> in web.xml): shared by every servlet and JSP
server.servlet.context-parameters.hostelName=Sunrise Hostel
server.servlet.context-parameters.categories=Electricity,Plumbing,Wi-Fi / Internet,Furniture,Cleaning,Water Cooler,Other
